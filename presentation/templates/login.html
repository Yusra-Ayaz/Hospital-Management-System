{% extends 'base.html' %}{% block title %}Sign in | CarePoint{% endblock %}{% block content %}<div class="auth-wrap"><form class="card shadow-sm p-4 auth-card" method="post"><h2>Welcome back</h2><p class="text-muted">Sign in to CarePoint Hospital.</p>{% if error %}<div class="alert alert-danger">{{error}}</div>{% endif %}<input class="form-control mb-3" type="email" name="email" placeholder="Email" required autofocus><input class="form-control mb-3" type="password" name="password" placeholder="Password" minlength="8" required><button class="btn btn-primary w-100">Sign in</button><p class="mt-3 mb-0 text-center">New here? <a href="/register">Create account</a></p></form></div>{% endblock %}
