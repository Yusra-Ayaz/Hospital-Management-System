<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CarePoint HMS{% endblock %}</title>
  <meta name="theme-color" content="#102a43"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="CarePoint">
  <link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/static/icons/carepoint-icon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head><body>
{% if user %}
<div class="app-shell"><aside class="sidebar p-3" id="sidebar">
  <a class="brand" href="/dashboard"><i class="fa-solid fa-heart-pulse"></i> <span>CarePoint</span></a><small>HOSPITAL SYSTEM</small><hr>
  <nav><a href="/dashboard"><i class="fa-solid fa-chart-pie"></i><span>Dashboard</span></a><a href="/patients"><i class="fa-solid fa-hospital-user"></i><span>Patients</span></a><a href="/doctors"><i class="fa-solid fa-user-doctor"></i><span>Doctors</span></a><a href="/appointments"><i class="fa-solid fa-calendar-check"></i><span>Appointments</span></a><a href="/records"><i class="fa-solid fa-file-medical"></i><span>Medical Records</span></a></nav>
  <form method="post" action="/logout"><button class="btn btn-outline-light w-100 mt-4"><i class="fa-solid fa-right-from-bracket"></i> <span>Sign out</span></button></form>
</aside><main class="content"><header class="topbar px-3 px-md-4"><button class="btn d-md-none" id="sidebarToggle" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></button><div class="ms-auto d-flex align-items-center gap-2"><button class="btn btn-sm btn-outline-primary" type="button" data-pwa-install><i class="fa-solid fa-download me-1"></i>Install app</button><a class="profile-link" href="/profile"><i class="fa-solid fa-circle-user"></i> {{ user.full_name }}</a></div></header><div class="p-3 p-md-4">{% if request.query_params.get('message') %}<div class="alert alert-success alert-dismissible fade show" role="alert"><i class="fa-solid fa-circle-check me-2"></i>{{request.query_params.get('message')}}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endif %}{% endif %}
{% block content %}{% endblock %}
{% if user %}</div></main></div>{% endif %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/static/js/app.js"></script>
</body></html>
