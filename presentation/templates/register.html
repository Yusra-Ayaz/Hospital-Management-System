{% extends 'base.html' %}{% block content %}<div class="auth-wrap"><form class="card shadow-sm p-4 auth-card" method="post"><h2>Create account</h2>{% if error %}<div class="alert alert-danger">{{error}}</div>{% endif %}<input class="form-control mb-3" name="full_name" placeholder="Full name" required><input class="form-control mb-3" type="email" name="email" placeholder="Email" required><input class="form-control mb-3" type="password" name="password" minlength="8" placeholder="Password (8+ characters)" required><button class="btn btn-primary w-100">Register</button><p class="mt-3 mb-0 text-center"><a href="/login">Back to sign in</a></p></form></div>{% endblock %}
